name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      # Vercel compila con CI=1: cualquier warning de ESLint tumba el deploy. Mejor verlo aqui.
      - name: Compilar como en Vercel
        run: npm run build
        env:
          CI: true
